name: Release

# npm trusts this workflow file to publish every package, so stable releases,
# tagged version publishes and pull request snapshot releases all live here.
#
# Snapshot releases run on `workflow_dispatch`: npm refuses trusted-publishing
# token exchanges for `issue_comment` runs. A `/snapshot-release` comment is
# turned into a dispatch by snapshot-release.yml, and people with write access
# can also start one from the Actions tab. Pull request code only runs in the
# credential-free snapshot-build job; the publish job checks every tarball
# before publishing it (see scripts/snapshot/).

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing @salt-ds/<library>@<version> tag to publish (leave empty for a snapshot release)"
        required: false
        type: string
      pull_request:
        description: "Pull request number to publish a snapshot release of (leave empty to publish release_tag)"
        required: false
        type: string
      sha:
        description: "Snapshot release: expected head commit (the run stops if the pull request has moved on)"
        required: false
        type: string
      comment_id:
        description: "Snapshot release: comment that requested the release (set by snapshot-release.yml)"
        required: false
        type: string
      dry_run:
        description: "Snapshot release: check everything, including npm trusted publishing, without publishing"
        required: false
        type: boolean
        default: false

permissions: {}

# No job restores or saves caches. `workflow_dispatch` runs can write to the
# default branch's cache by default, and snapshot runs build pull request code.
cache-mode: none

# Snapshot runs get a group per pull request, so they can't hold up a stable
# release, and a second request can't cancel one mid-publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.pull_request != '' && format('snapshot-{0}', inputs.pull_request) || github.ref }}
  cancel-in-progress: false

jobs:
  select-release-mode:
    name: Select Release Mode
    if: github.event_name == 'push' && github.repository == 'jpmorganchase/salt-ds'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    permissions:
      contents: read # Needed to check out the repository before selecting Changesets mode.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
      - name: Install dependencies
        run: yarn install
      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Version Packages
    if: needs.select-release-mode.outputs.mode == 'version'
    needs: select-release-mode
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Needed for changesets to commit version changes.
      pull-requests: write # Needed for changesets to open/update the Version Packages PR.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
      - name: Install dependencies
        run: yarn install
      - name: Version packages
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: yarn changeset version

  publish:
    name: Publish Packages
    if: needs.select-release-mode.outputs.mode == 'publish'
    needs: select-release-mode
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Needed for changesets to push tags and create GitHub releases.
      id-token: write # Needed for npm trusted publishing provenance.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: yarn install
      - name: Publish packages
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: yarn release
        env:
          NPM_CONFIG_PROVENANCE: "true"

  release:
    name: Release
    if: always() && github.event_name == 'push' && github.repository == 'jpmorganchase/salt-ds'
    needs:
      - select-release-mode
      - version
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check release result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          MODE: ${{ needs.select-release-mode.outputs.mode }}
          SELECT_RESULT: ${{ needs.select-release-mode.result }}
          VERSION_RESULT: ${{ needs.version.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        with:
          script: |
            const mode = process.env.MODE || '';
            const selectResult = process.env.SELECT_RESULT;
            const versionResult = process.env.VERSION_RESULT;
            const publishResult = process.env.PUBLISH_RESULT;

            core.info(`Selected mode: ${mode || '<empty>'}`);
            core.info(`select-release-mode: ${selectResult}`);
            core.info(`version: ${versionResult}`);
            core.info(`publish: ${publishResult}`);

            if (selectResult !== 'success') {
              core.setFailed('Release mode selection failed.');
              return;
            }

            if (mode === 'version' && versionResult !== 'success') {
              core.setFailed('Version package PR creation failed.');
              return;
            }

            if (mode === 'publish' && publishResult !== 'success') {
              core.setFailed('Package publish failed.');
              return;
            }

            if (!['none', 'publish', 'version'].includes(mode)) {
              core.setFailed(`Unexpected Changesets mode: ${mode || '<empty>'}`);
            }

  # Production Storybook only updates when packages are published. These jobs
  # need `publish` directly: depending on `release` would skip them, because
  # the skipped `version` job propagates through its `always()` condition.
  build-release-storybook:
    name: Build Release Storybook
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # Needed to check out the repository before building Storybook.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
      - name: Install dependencies
        run: yarn install
      - name: Run Storybook build
        run: yarn build-storybook
        env:
          NODE_OPTIONS: "--max_old_space_size=6144"
      - name: Upload Storybook Static
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: storybook-build
          path: ./storybook-static
          retention-days: 1

  publish-storybook:
    name: Publish Storybook
    needs: build-release-storybook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Downloading an artifact from the same run needs no token permissions.
    permissions: {}
    # The Cloudflare secrets live in the `storybook` environment, which only
    # the default branch can use.
    environment:
      name: storybook
      deployment: false
    steps:
      - name: Download Storybook build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: storybook-build
          path: ./storybook-static
      - name: Remove non-static files
        run: rm -rf ./storybook-static/preview-stats.json ./storybook-static/_worker.js ./storybook-static/_routes.json ./storybook-static/functions
      - name: Publish Storybook
        uses: cloudflare/wrangler-action@25853364521e0d392ece9b0c1e97a4b37b638087 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_SALT_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_SALT_ACCOUNT_ID }}
          command: pages deploy ./storybook-static --project-name=saltdesignsystem-storybook --branch=main

  prepare-version-publish:
    name: Prepare Version Publish
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'jpmorganchase/salt-ds' &&
      github.ref == 'refs/heads/main' &&
      inputs.pull_request == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Checkout recovery tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          path: recovery-tooling
          persist-credentials: false
      - name: Validate release tag
        id: release
        working-directory: recovery-tooling
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^@salt-ds/[a-z0-9-]+@[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "::error::Release tag must match @salt-ds/<library>@<version>."
            exit 1
          fi

          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "::error::Release tag '$RELEASE_TAG' does not exist."
            exit 1
          fi

          commit=$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::Release tag '$RELEASE_TAG' is not part of main."
            exit 1
          fi

          node_version=$(
            git show "$commit:.github/workflows/release.yml" |
              sed -nE 's/^[[:space:]]*node-version:[[:space:]]*"?([0-9]+)"?.*/\1/p' |
              head -1
          )
          if [[ ! "$node_version" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not determine the Node.js version used by '$RELEASE_TAG'."
            exit 1
          fi

          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "node_version=$node_version" >> "$GITHUB_OUTPUT"
          echo "Preparing $RELEASE_TAG from $commit with Node.js $node_version."
      - name: Checkout historical release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release.outputs.commit }}
          path: release-source
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ steps.release.outputs.node_version }}
      - name: Enable Corepack
        run: corepack enable
      - name: Install historical dependencies
        working-directory: release-source
        run: yarn install --immutable
      - name: Build historical release
        working-directory: release-source
        run: yarn build
        env:
          NODE_OPTIONS: "--max_old_space_size=6144"
      - name: Pack tagged version
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          node recovery-tooling/scripts/prepareVersionPublish.mjs \
            --source release-source \
            --output publish-artifact \
            --release-tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT"
      - name: Upload version
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: version-publish-${{ github.run_id }}
          path: publish-artifact
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-version:
    name: Publish Version
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'jpmorganchase/salt-ds' &&
      github.ref == 'refs/heads/main'
    needs: prepare-version-publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Needed for npm trusted publishing provenance.
    steps:
      - name: Checkout recovery tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.11.0 --ignore-scripts
      - name: Download version
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: version-publish-${{ github.run_id }}
          path: publish-artifact
      - name: Publish tagged library
        env:
          NPM_CONFIG_PROVENANCE: "true"
          RELEASE_COMMIT: ${{ needs.prepare-version-publish.outputs.commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          node scripts/publishVersion.mjs \
            --artifact publish-artifact \
            --release-tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --npm-tag latest

  # Snapshot releases. Started by snapshot-release.yml (a `/snapshot-release`
  # comment) or by hand from the Actions tab; GitHub only lets people with
  # write access start a workflow_dispatch run.

  snapshot-check:
    name: Check Snapshot Request
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'jpmorganchase/salt-ds' &&
      inputs.pull_request != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # Check out this workflow's own commit for the request script.
      pull-requests: read # Read the pull request's state and head commit.
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check the pull request
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PULL_REQUEST: ${{ inputs.pull_request }}
          EXPECTED_SHA: ${{ inputs.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        with:
          script: |
            if (process.env.RELEASE_TAG) {
              core.setFailed('Set either release_tag or pull_request, not both.');
              return;
            }
            const { pathToFileURL } = require('node:url');
            const { checkSnapshotDispatch } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/snapshot/request.mjs`).href
            );
            const result = await checkSnapshotDispatch({
              github,
              context,
              pullRequest: process.env.PULL_REQUEST,
              expectedSha: process.env.EXPECTED_SHA,
            });
            if (!result.ok) {
              core.setFailed(result.reason);
              return;
            }
            core.setOutput('sha', result.sha);

  snapshot-build:
    name: Build Snapshot Packages
    needs: snapshot-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Runs pull request code, so it gets read access and nothing else: no
    # id-token, no npm credentials, no write token and no cache access.
    permissions:
      contents: read
    outputs:
      changesets: ${{ steps.version.outputs.changesets }}
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.snapshot-check.outputs.sha }}
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
      - name: Install dependencies
        run: yarn install
      - name: Create snapshot versions
        id: version
        run: |
          if output=$(yarn changeset version --snapshot snapshot 2>&1); then code=0; else code=$?; fi
          printf '%s\n' "$output"
          if grep -q "No unreleased changesets found" <<< "$output"; then
            echo "::notice::No unreleased changesets found, so there is nothing to publish."
            echo "changesets=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          else
            echo "changesets=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build snapshot packages
        if: steps.version.outputs.changesets == 'true'
        run: yarn build
      - name: Pack snapshot packages
        if: steps.version.outputs.changesets == 'true'
        run: |
          dir="$RUNNER_TEMP/snapshot-tarballs"
          mkdir -p "$dir"
          yarn workspaces foreach --all --no-private pack --out "$dir/%s-%v.tgz"
          # Packages without changesets keep their released version and aren't published.
          find "$dir" -name '*.tgz' ! -name '*-0.0.0-snapshot-*' -delete
          ls "$dir"
      - name: Upload tarballs
        if: steps.version.outputs.changesets == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: snapshot-tarballs
          path: ${{ runner.temp }}/snapshot-tarballs/*.tgz
          if-no-files-found: error
          retention-days: 7

  snapshot-publish:
    name: Publish Snapshot Packages
    needs: snapshot-build
    if: needs.snapshot-build.outputs.changesets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds the publish credential, so it never runs pull request code: it
    # checks out this workflow's own commit and only reads the tarballs.
    permissions:
      contents: read # Check out this workflow's own commit for the publish scripts.
      id-token: write # Needed for npm trusted publishing.
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.11.0 --ignore-scripts
      - name: Download tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: snapshot-tarballs
          path: ${{ runner.temp }}/snapshot-tarballs
      - name: Check and publish tarballs
        id: publish
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/snapshot/publishTarballs.mjs "$RUNNER_TEMP/snapshot-tarballs" --dry-run
          else
            node scripts/snapshot/publishTarballs.mjs "$RUNNER_TEMP/snapshot-tarballs"
          fi

  snapshot-report:
    name: Report Snapshot Release
    needs:
      - snapshot-check
      - snapshot-build
      - snapshot-publish
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'jpmorganchase/salt-ds' &&
      inputs.pull_request != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # Check out this workflow's own commit for the report script.
      issues: write # Comment on the pull request.
      pull-requests: write # React to the request comment.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Report on the pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PULL_REQUEST: ${{ inputs.pull_request }}
          COMMENT_ID: ${{ inputs.comment_id }}
          SHA: ${{ needs.snapshot-check.outputs.sha }}
          BUILD_RESULT: ${{ needs.snapshot-build.result }}
          CHANGESETS: ${{ needs.snapshot-build.outputs.changesets }}
          RESULT: ${{ needs.snapshot-publish.result }}
          PUBLISHED: ${{ needs.snapshot-publish.outputs.published }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { reportSnapshotRelease } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/snapshot/request.mjs`).href
            );
            await reportSnapshotRelease({
              github,
              context,
              core,
              pullRequest: process.env.PULL_REQUEST,
              commentId: process.env.COMMENT_ID,
              sha: process.env.SHA,
              result: process.env.RESULT,
              published: process.env.PUBLISHED,
              dryRun: process.env.DRY_RUN === 'true',
              noChangesets:
                process.env.BUILD_RESULT === 'success' &&
                process.env.CHANGESETS === 'false',
            });
