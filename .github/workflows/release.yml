name: Release

on:
  push:
    branches:
      - main
  issue_comment:
    types:
      - created

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'issue_comment' && github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  select-release-mode:
    name: Select Release Mode
    if: github.event_name == 'push' && github.repository == 'jpmorganchase/salt-ds'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    permissions:
      contents: read # Needed to check out the repository before selecting Changesets mode.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: yarn install
      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1

  version:
    name: Version Packages
    if: needs.select-release-mode.outputs.mode == 'version'
    needs: select-release-mode
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Needed for changesets to commit version changes.
      pull-requests: write # Needed for changesets to open/update the Version Packages PR.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: yarn install
      - name: Version packages
        uses: changesets/action/version@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          script: yarn changeset version

  publish:
    name: Publish Packages
    if: needs.select-release-mode.outputs.mode == 'publish'
    needs: select-release-mode
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Needed for changesets to push tags and create GitHub releases.
      id-token: write # Needed for npm trusted publishing provenance.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: yarn install
      - name: Publish packages
        uses: changesets/action/publish@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          script: yarn release
        env:
          NPM_CONFIG_PROVENANCE: "true"

  release:
    name: Release
    if: always() && github.event_name == 'push' && github.repository == 'jpmorganchase/salt-ds'
    needs:
      - select-release-mode
      - version
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check release result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          MODE: ${{ needs.select-release-mode.outputs.mode }}
          SELECT_RESULT: ${{ needs.select-release-mode.result }}
          VERSION_RESULT: ${{ needs.version.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        with:
          script: |
            const mode = process.env.MODE || '';
            const selectResult = process.env.SELECT_RESULT;
            const versionResult = process.env.VERSION_RESULT;
            const publishResult = process.env.PUBLISH_RESULT;

            core.info(`Selected mode: ${mode || '<empty>'}`);
            core.info(`select-release-mode: ${selectResult}`);
            core.info(`version: ${versionResult}`);
            core.info(`publish: ${publishResult}`);

            if (selectResult !== 'success') {
              core.setFailed('Release mode selection failed.');
              return;
            }

            if (mode === 'version' && versionResult !== 'success') {
              core.setFailed('Version package PR creation failed.');
              return;
            }

            if (mode === 'publish' && publishResult !== 'success') {
              core.setFailed('Package publish failed.');
              return;
            }

            if (!['none', 'publish', 'version'].includes(mode)) {
              core.setFailed(`Unexpected Changesets mode: ${mode || '<empty>'}`);
            }

  build-release-storybook:
    name: Build Release Storybook
    if: github.event_name == 'push' && github.repository == 'jpmorganchase/salt-ds'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # Needed to check out the repository before building Storybook.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: yarn install
      - name: Run Storybook build
        run: yarn build-storybook
        env:
          NODE_OPTIONS: "--max_old_space_size=6144"

  snapshot:
    name: Snapshot Release
    if: |
      github.event_name == 'issue_comment' &&
      github.repository == 'jpmorganchase/salt-ds' &&
      github.event.issue.pull_request &&
      (
        github.event.comment.body == '/release-pr' ||
        startsWith(github.event.comment.body, '/release-pr ') ||
        startsWith(github.event.comment.body, format('/release-pr{0}', fromJSON('"\n"'))) ||
        startsWith(github.event.comment.body, format('/release-pr{0}', fromJSON('"\r"'))) ||
        startsWith(github.event.comment.body, format('/release-pr{0}', fromJSON('"\t"'))) ||
        github.event.comment.body == '/snapshot-release' ||
        startsWith(github.event.comment.body, '/snapshot-release ') ||
        startsWith(github.event.comment.body, format('/snapshot-release{0}', fromJSON('"\n"'))) ||
        startsWith(github.event.comment.body, format('/snapshot-release{0}', fromJSON('"\r"'))) ||
        startsWith(github.event.comment.body, format('/snapshot-release{0}', fromJSON('"\t"')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write # Needed to post and update the snapshot status comment on the PR's issue timeline.
      pull-requests: write # Needed to add reactions to the trigger comment (PR comments are scoped under the pull_requests permission, not issues).
      id-token: write # Needed for npm trusted publishing provenance.
    concurrency:
      group: ${{ github.workflow }}-snapshot-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Enforce write permissions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          COMMENT_ID: ${{ github.event.comment.id }}
        with:
          script: |
            const username = context.payload.comment.user.login;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;

            const response = await github.rest.repos.getCollaboratorPermissionLevel({
              owner,
              repo,
              username,
            });

            const permission = response.data.permission;
            const allowedPermissions = new Set(["admin", "maintain", "write"]);

            if (allowedPermissions.has(permission)) {
              await github.rest.reactions.createForIssueComment({
                owner,
                repo,
                comment_id: process.env.COMMENT_ID,
                content: "eyes",
              });
            } else {
              const errorMessage = `Snapshot release was not started because @${username} does not have write permissions.`;

              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner,
                repo,
                body: `${errorMessage}\n\n[View workflow run](${runUrl})`,
              });

              core.setFailed(errorMessage);
            }

      - name: Validate pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        id: pr_data
        with:
          script: |
            try {
              const pullRequest = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              });

              core.setOutput("headRepository", pullRequest.data.head.repo.full_name);
              core.setOutput("headSha", pullRequest.data.head.sha);

              if (pullRequest.data.head.repo.fork) {
                const errorMessage = 'snapshot releases not supported on pull requests from forked repositories.';
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: errorMessage,
                });
                core.setFailed(errorMessage);
              }
            } catch (err) {
              core.setFailed(`Request failed with error ${err}`);
            }

      - name: Create snapshot status comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        id: snapshot_status
        env:
          HEAD_SHA: ${{ steps.pr_data.outputs.headSha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = process.env.HEAD_SHA;
            const shortSha = headSha.slice(0, 7);
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;

            const response = await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner,
              repo,
              body: `Snapshot release started for \`${shortSha}\`.\n\n[View workflow run](${runUrl})`,
            });

            core.setOutput("commentId", response.data.id);

      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.pr_data.outputs.headRepository }}
          ref: ${{ steps.pr_data.outputs.headSha }}
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: yarn install

      - name: Create snapshot versions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            let output = '';
            const exitCode = await exec.exec(
              'yarn',
              ['changeset', 'version', '--snapshot', 'snapshot'],
              {
                ignoreReturnCode: true,
                listeners: {
                  stdout: (data) => { output += data.toString(); },
                  stderr: (data) => { output += data.toString(); },
                },
              },
            );

            if (exitCode === 0) {
              return;
            }

            if (exitCode === 1 && output.includes('No unreleased changesets found.')) {
              core.info('No unreleased changesets found; continuing without snapshot version changes.');
              return;
            }

            core.setFailed(`Snapshot version creation failed with exit code ${exitCode}.`);

      - name: Build snapshot packages
        run: yarn build

      - name: Verify MCP package and installed consumer
        run: yarn release:verify:mcp

      - name: Publish snapshot packages
        id: publish
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          NPM_CONFIG_PROVENANCE: "true"
        with:
          script: |
            let output = '';
            await exec.exec(
              'yarn',
              ['changeset', 'publish', '--tag', 'snapshot', '--no-git-tag'],
              {
                listeners: {
                  stdout: (data) => { output += data.toString(); },
                  stderr: (data) => { output += data.toString(); },
                },
              },
            );

            // `changeset publish` prints a banner followed by an indented
            // list of `name@version` tags for each successfully published
            // package, e.g.
            //
            //   🦋  packages published successfully:
            //   🦋    @salt-ds/core@0.0.0-snapshot-20260814000000
            //   🦋    @salt-ds/lab@0.0.0-snapshot-20260814000000
            //
            // Anchoring on the banner string avoids picking up unrelated
            // `name@version` mentions in warnings or errors.
            const [, after = ''] = output.split('packages published successfully:\n');
            const newTags = after
              .split('\n')
              .flatMap((line) => Array.from(line.matchAll(/\s+(\S+@\S+)/g), (m) => m[1]));

            core.setOutput('publishedTags', newTags.join('\n'));

      - name: Update snapshot status comment
        if: success() && steps.snapshot_status.outputs.commentId != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          COMMENT_ID: ${{ github.event.comment.id }}
          HEAD_SHA: ${{ steps.pr_data.outputs.headSha }}
          PUBLISHED_TAGS: ${{ steps.publish.outputs.publishedTags }}
          STATUS_COMMENT_ID: ${{ steps.snapshot_status.outputs.commentId }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const statusCommentId = Number.parseInt(process.env.STATUS_COMMENT_ID, 10);
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const shortSha = process.env.HEAD_SHA.slice(0, 7);
            const newTags = (process.env.PUBLISHED_TAGS || '')
              .split('\n')
              .map((tag) => tag.trim())
              .filter(Boolean);

            if (newTags.length) {
              const multiple = newTags.length > 1;
              const body = (
                `Snapshot release completed for \`${shortSha}\`.\n\n` +
                `🫰✨ **Thanks @${context.actor}! ` +
                `Your snapshot${multiple ? 's have' : ' has'} been published to npm.**\n\n` +
                `Test the snapshot${multiple ? 's' : ''} by updating your \`package.json\` ` +
                `with the newly published version${multiple ? 's' : ''}:\n` +
                newTags.map((tag) => (
                  '```sh\n' +
                  `yarn add ${tag}\n` +
                  '```'
                )).join('\n') +
                `\n\n[View workflow run](${runUrl})`
              );

              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: statusCommentId,
                body,
              });

              await github.rest.reactions.createForIssueComment({
                owner,
                repo,
                comment_id: process.env.COMMENT_ID,
                content: "rocket",
              });
            } else {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: statusCommentId,
                body: `Snapshot release finished for \`${shortSha}\`, but no packages were published.\n\n[View workflow run](${runUrl})`,
              });
            }

      - name: Update snapshot status on failure
        if: ${{ steps.snapshot_status.outputs.commentId != '' && (failure() || cancelled()) }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          STATUS_COMMENT_ID: ${{ steps.snapshot_status.outputs.commentId }}
          HEAD_SHA: ${{ steps.pr_data.outputs.headSha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const statusCommentId = Number.parseInt(process.env.STATUS_COMMENT_ID, 10);
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const shortSha = process.env.HEAD_SHA.slice(0, 7);

            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: statusCommentId,
              body: `Snapshot release failed for \`${shortSha}\`.\n\n[View workflow run](${runUrl})`,
            });
