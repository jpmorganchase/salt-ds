name: "React (canary)"
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest-browser-tests:
    name: Browser Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "yarn"
      - name: Install dependencies
        run: yarn
      - name: Setup React canary
        run: |
          yarn set resolution react@npm:^18.0.0 npm:canary
          yarn set resolution react-dom@npm:^18.0.0 npm:canary
      - name: Verify React canary
        run: |
          yarn node -e 'const version = require("react/package.json").version; if (!version.includes("canary")) throw new Error("Expected React canary, received " + version)'
          yarn node -e 'const version = require("react-dom/package.json").version; if (!version.includes("canary")) throw new Error("Expected React DOM canary, received " + version)'
      - name: Build packages
        run: yarn run build
      - name: Browser Tests
        run: yarn run test:components
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: vitest-browser-screenshots-canary
          path: test/browser/screenshots
          if-no-files-found: ignore
