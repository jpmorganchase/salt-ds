name: "Browsers (nightly)"
on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"
  pull_request:
    paths:
      - ".github/workflows/browsers-cron.yml"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    name: Browser Tests (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: "yarn"
      - name: Install dependencies
        run: yarn
      - name: Install browser
        env:
          TEST_BROWSER: ${{ matrix.browser }}
        run: yarn playwright install --with-deps "$TEST_BROWSER"
      - name: Build packages
        run: yarn run build
      - name: Test Components
        env:
          TEST_BROWSER: ${{ matrix.browser }}
        run: yarn run test:components
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: browser-screenshots-${{ matrix.browser }}
          path: |
            .vitest/attachments
            test/browser/screenshots
          if-no-files-found: ignore
