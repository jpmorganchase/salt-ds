name: "Browsers (nightly)"
on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-version:
    name: Playwright version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read Playwright version
        id: version
        run: |
          version=$(node -p 'require("./package.json").devDependencies.playwright')
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::playwright must be pinned to an exact version to match a Playwright Docker image, found $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  browser-tests:
    name: Browser Tests (${{ matrix.browser }})
    needs: playwright-version
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The Playwright image includes the browsers and their system packages, so
    # the job doesn't depend on the Ubuntu apt mirrors, which can be very slow.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: "yarn"
      - name: Install dependencies
        run: yarn
      - name: Build packages
        run: yarn run build
      - name: Test Components
        env:
          TEST_BROWSER: ${{ matrix.browser }}
        run: yarn run test:components
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: browser-screenshots-${{ matrix.browser }}
          path: |
            .vitest/attachments
            test/browser/screenshots
          if-no-files-found: ignore
