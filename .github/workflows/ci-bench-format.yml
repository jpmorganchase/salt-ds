name: CI Bench Format Probe
on:
  push:
    branches:
      - perf/ci-bench-balanced-format-20261116
permissions: {}
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: "yarn"
      - run: yarn
      - name: Apply Biome formatter in runner
        run: yarn biome check --write vitest.browser.config.mts test/browser/ciDurationSequencer.ts
      - name: Show formatting diff
        if: always()
        run: git --no-pager diff -- vitest.browser.config.mts test/browser/ciDurationSequencer.ts
