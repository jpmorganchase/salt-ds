name: "Test"
on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "yarn"
      - name: Install dependencies
        run: yarn
      - name: Lint
        run: yarn biome ci --reporter=github
      - name: Prettier
        run: yarn run prettier:ci
      - name: Stylelint
        run: yarn run lint:style
      - name: Check no import from src
        run: |
          if find ./packages -type f \( -iname \*.ts -o -iname \*.tsx \) -exec grep "@salt-ds/.*/src" {} +; then
            echo "Should not import from src in any typescript file"
            exit 1;
          fi
      - name: Spellcheck
        run: yarn workspace @salt-ds/site spellcheck

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "yarn"
      - name: Install dependencies
        run: yarn
      - name: Build
        run: yarn build
      - name: Check Core declarations against supported React types
        run: yarn check:core-react-types
      - name: Check AI tooling package dry runs
        run: yarn check:ai-tooling:pack -- --profile pre-agent-support --report dist/salt-ai-pack/unit-03.json
      - name: Check Date Adapters packed consumers
        run: yarn check:date-adapters:pack
      - name: Check public docs, links, package presentation, and examples
        run: yarn check:public-docs
      - name: Build public documentation site
        run: yarn workspace @salt-ds/site build
      - name: Check standalone Vite, Next, and operations applications
        run: yarn check:sample-apps
      - name: Check build core package.json dependencies
        run: |
          if grep -q "@salt-ds\/\(core\|lab\)\":" dist/salt-ds-core/package.json; then
              echo "Core package can not reference itself or lab package"
              exit 1;
          fi
      - name: Check build icon package.json dependencies
        run: |
          if grep -q "@salt-ds\/\(icon\|core\|lab\)\":" dist/salt-ds-icon/package.json; then
              echo "Icon package can not reference itself or core or lab package"
              exit 1;
          fi
      - name: Check build lab package.json dependencies
        run: |
          if grep -q "@salt-ds\/lab\":" dist/salt-ds-lab/package.json; then
              echo "Lab package can not reference itself"
              exit 1;
          fi
  type-checks:
    name: Type Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "yarn"
      - name: Install dependencies
        run: yarn
      - name: Run typecheck
        run: yarn run typecheck
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "yarn"
      - name: Install dependencies
        run: yarn
      - name: Build MCP registry test inputs
        run: yarn workspace @salt-ds/knowledge build:knowledge
      - run: yarn run test
  consumer-smoke:
    name: Consumer smoke (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node }}
          cache: "yarn"
      - name: Install dependencies
        run: yarn
      - name: Consumer smoke test
        run: |
          yarn build:ai-tooling
          yarn check:ai-tooling:pack -- --profile pre-agent-support --report dist/salt-ai-pack/unit-03.json
          yarn smoke:consumer --skip-build --pack-report dist/salt-ai-pack/unit-03.json
  browser-tests:
    name: Browser Tests (React ${{ matrix.react }})
    strategy:
      fail-fast: false
      matrix:
        react: [16, 17, 18, 19]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "yarn"
      - name: Install dependencies
        run: yarn
      - name: Setup react
        env:
          REACT_VERSION: ${{ matrix.react }}
        run: |
          yarn set resolution react@npm:^18.0.0 "npm:^$REACT_VERSION"
          yarn set resolution react-dom@npm:^18.0.0 "npm:^$REACT_VERSION"
      - name: Build packages
        run: yarn run build
      - name: Test Components
        run: yarn run test:components
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: browser-screenshots-${{ matrix.react }}
          path: test/browser/screenshots
          if-no-files-found: ignore
