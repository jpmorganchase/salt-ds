name: "Storybook Deploy"
run-name: Storybook deploy for ${{ github.event.workflow_run.head_branch }}

# Publishes the Storybook built by build-storybook.yml:
#
# - to Chromatic for main, and for pull requests with the `chromatic` label;
# - as a Cloudflare Pages preview for pull requests from this repository.
#   Pull requests from forks don't get a preview, since the build is
#   untrusted; label one `chromatic` to review its Storybook.
#
# workflow_run runs on the default branch, which the `storybook` environment
# (holding the Chromatic and Cloudflare secrets) is restricted to.

on:
  workflow_run:
    workflows: ["Build Storybook"]
    types:
      - completed

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  context:
    name: Resolve Workflow Run
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # Needed to resolve the pull request and its labels.
    outputs:
      base: ${{ steps.run_context.outputs.base }}
      branchName: ${{ steps.run_context.outputs.branchName }}
      deploymentBranch: ${{ steps.run_context.outputs.deploymentBranch }}
      headRepository: ${{ steps.run_context.outputs.headRepository }}
      headSha: ${{ steps.run_context.outputs.headSha }}
      issueNumber: ${{ steps.run_context.outputs.issueNumber }}
      noTurbosnap: ${{ steps.run_context.outputs.noTurbosnap }}
      runChromatic: ${{ steps.run_context.outputs.runChromatic }}
      sameRepository: ${{ steps.run_context.outputs.sameRepository }}
    steps:
      - name: Resolve workflow run context
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        id: run_context
        with:
          script: |
            const workflowRun = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            async function getPullRequest() {
              if (workflowRun.event !== "pull_request") {
                return undefined;
              }

              const workflowPullRequest = workflowRun.pull_requests?.[0];

              if (workflowPullRequest?.number) {
                const response = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: workflowPullRequest.number,
                });

                return response.data;
              }

              const associatedPullRequests = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: workflowRun.head_sha,
              });

              const pullRequest = associatedPullRequests.data.find(({ head }) => (
                head.sha === workflowRun.head_sha &&
                head.repo?.full_name === workflowRun.head_repository.full_name
              )) ?? associatedPullRequests.data[0];

              if (!pullRequest) {
                throw new Error(`Could not resolve a pull request for workflow run ${workflowRun.id}`);
              }

              const response = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pullRequest.number,
              });

              return response.data;
            }

            const pullRequest = await getPullRequest();
            const labels = new Set((pullRequest?.labels ?? []).map(({ name }) => name));
            const branchName = pullRequest ? pullRequest.head.label : workflowRun.head_branch;
            const headRepository = pullRequest?.head.repo?.full_name ?? workflowRun.head_repository.full_name;

            core.setOutput("base", pullRequest ? pullRequest.base.ref : workflowRun.head_branch);
            core.setOutput("branchName", branchName);
            core.setOutput("deploymentBranch", pullRequest ? `pr-${pullRequest.number}` : workflowRun.head_branch);
            core.setOutput("headRepository", headRepository);
            core.setOutput("headSha", workflowRun.head_sha);
            core.setOutput("issueNumber", pullRequest?.number ?? "");
            core.setOutput("noTurbosnap", String(labels.has("no turbosnap")));
            core.setOutput("runChromatic", String(labels.has("chromatic")));
            core.setOutput("sameRepository", String(headRepository === `${owner}/${repo}`));

            core.info(`Resolved ${workflowRun.event} workflow run for ${branchName} at ${workflowRun.head_sha}`);

  chromatic:
    name: Publish Chromatic
    needs: context
    if: ${{ needs.context.outputs.branchName == 'main' || needs.context.outputs.runChromatic == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read # Needed to download the Storybook build artifact from the triggering run.
      contents: read
    environment:
      name: storybook
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          repository: ${{ needs.context.outputs.headRepository }}
          ref: ${{ needs.context.outputs.headSha }}
          persist-credentials: false

      - name: Fetch base branch from upstream
        if: github.event.workflow_run.event == 'pull_request'
        env:
          UPSTREAM_URL: ${{ github.event.repository.clone_url }}
          BASE_BRANCH: ${{ needs.context.outputs.base }}
          HEAD_SHA: ${{ needs.context.outputs.headSha }}
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream "$BASE_BRANCH"
          git checkout -B "$BASE_BRANCH" "upstream/$BASE_BRANCH"
          git checkout -B pr-head "$HEAD_SHA"
          git clean -ffdx && git reset --hard HEAD
      - name: Determine if Chromatic can be skipped for this commit
        id: changed_files
        if: ${{ needs.context.outputs.branchName == 'main' }}
        timeout-minutes: 2
        env:
          HEAD_SHA: ${{ needs.context.outputs.headSha }}
        run: |
          set -euo pipefail

          if ! parent=$(git rev-parse --verify "${HEAD_SHA}^" 2>/dev/null); then
            echo "No parent commit available; will run Chromatic."
            echo "skipChromatic=false" >> "$GITHUB_OUTPUT"
            echo "### Chromatic decision: **run** _(no parent commit)_" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if bash scripts/chromatic/should-skip-main-build.sh "$parent" "$HEAD_SHA"; then
            echo "skipChromatic=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipChromatic=false" >> "$GITHUB_OUTPUT"
          fi
      - name: "Download build artifact"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: storybook-build
          path: ${{ runner.temp }}/storybook-static
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Publish to Chromatic
        uses: chromaui/action@add73a4a1d7bc609b8664be286b7309707f1938d # v18
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          exitOnceUploaded: true
          # TurboSnap on every branch (incl. main). The `no turbosnap` PR
          # label opts out per-PR. Theme files affect every story — force a
          # full pass when they change.
          onlyChanged: ${{ needs.context.outputs.noTurbosnap != 'true' }}
          externals: ${{ needs.context.outputs.noTurbosnap != 'true' && 'packages/(theme)/**' || '' }}
          # Skip the build on main commits that only touch non-visual files;
          # otherwise fall back to the existing changeset-release/* skip glob.
          skip: ${{ steps.changed_files.outputs.skipChromatic == 'true' && '**' || 'changeset-release/*' }}
          autoAcceptChanges: ${{ needs.context.outputs.branchName == 'main' && needs.context.outputs.noTurbosnap != 'true' }}
          ignoreLastBuildOnBranch: "**"
          # Expanded tracing is conservative — more snapshots, fewer missed
          # regressions. Keep wherever TurboSnap is active.
          traceChanged: ${{ needs.context.outputs.noTurbosnap != 'true' && 'expanded' || '' }}
          storybookBuildDir: ${{ runner.temp }}/storybook-static
          branchName: ${{ needs.context.outputs.branchName }}
          debug: true
        env:
          LOG_LEVEL: "debug"

  remove-chromatic-label:
    name: Remove Chromatic Label
    if: ${{ needs.chromatic.result == 'success' && needs.context.outputs.issueNumber != '' && needs.context.outputs.runChromatic == 'true' }}
    needs:
      - context
      - chromatic
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Needed to remove the opt-in "chromatic" label from the PR.
    steps:
      - name: Remove Chromatic label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ISSUE_NUMBER: ${{ needs.context.outputs.issueNumber }}
        with:
          script: |
            const issueNumberValue = process.env.ISSUE_NUMBER;

            if (!/^[1-9]\d*$/.test(issueNumberValue)) {
              core.warning(`Skipping label removal for invalid issue number: ${issueNumberValue}`);
              return;
            }

            const issueNumber = Number.parseInt(issueNumberValue, 10);

            try {
              await github.rest.issues.removeLabel({
                issue_number: issueNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: "chromatic"
              });
            } catch (error) {
              console.log(error);
            }

  preview:
    name: Deploy Storybook to Cloudflare Pages
    needs: context
    # Production (main) is deployed by release.yml once packages are published,
    # so it only changes when there's a release.
    if: ${{ github.event.workflow_run.event == 'pull_request' && needs.context.outputs.sameRepository == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read # Needed to download the Storybook build artifact from the triggering run.
      deployments: write # Needed by Cloudflare Pages deployment integration.
      statuses: write # Needed to publish the Storybook commit status.
    environment:
      name: storybook
      deployment: false
    steps:
      - name: Set initial commit status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: "pending",
              description: "Pending",
              context: "Storybook"
            })

      - name: "Download build artifact"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: storybook-build
          path: ${{ runner.temp }}/storybook-static
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      # Pages runs `_worker.js`/`functions` and applies `_headers`/`_redirects`
      # from the deployed directory, so only static files are deployed.
      - name: "Remove non-static preview files"
        run: rm -rf "$STORYBOOK_STATIC_DIR/preview-stats.json" "$STORYBOOK_STATIC_DIR/_worker.js" "$STORYBOOK_STATIC_DIR/_routes.json" "$STORYBOOK_STATIC_DIR/functions" "$STORYBOOK_STATIC_DIR/_headers" "$STORYBOOK_STATIC_DIR/_redirects"
        env:
          STORYBOOK_STATIC_DIR: ${{ runner.temp }}/storybook-static

      - name: Publish
        uses: cloudflare/wrangler-action@25853364521e0d392ece9b0c1e97a4b37b638087 # v4
        id: publish
        with:
          apiToken: ${{ secrets.CLOUDFLARE_SALT_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_SALT_ACCOUNT_ID }}
          command: pages deploy ${{ runner.temp }}/storybook-static --project-name=saltdesignsystem-storybook --branch=${{ needs.context.outputs.deploymentBranch }}

      - name: Update deploy status (success)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: success()
        env:
          STORYBOOK_URL: ${{ steps.publish.outputs.pages-deployment-alias-url }}
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: "success",
              description: "Successfully deployed",
              context: "Storybook",
              target_url: process.env.STORYBOOK_URL
            });

      - name: Update deploy status (failure)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: failure()
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            const targetUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: "error",
              description: "Failed to deploy",
              context: "Storybook",
              target_url: targetUrl
            });
